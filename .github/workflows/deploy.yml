name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Required by actions/deploy-pages v4+ to look up the uploaded artifact.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Add .nojekyll and CNAME
        run: |
          touch out/.nojekyll
          echo "jeffmboya.com" > out/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # v4 stopped bundling dotfiles by default; without this the
          # .nojekyll written above is silently dropped from the artifact.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
