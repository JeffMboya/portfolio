<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">

  <!-- Background -->
  <rect width="800" height="400" fill="#060D14"/>

  <!-- Subtle dot-grid texture -->
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="800" height="400" fill="url(#dots)"/>

  <!-- Central glow -->
  <radialGradient id="centerGlow" cx="50%" cy="47%" r="35%">
    <stop offset="0%" stop-color="#1a3a2a" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#060D14" stop-opacity="0"/>
  </radialGradient>
  <rect width="800" height="400" fill="url(#centerGlow)"/>

  <!-- ── Debate edges (draw first, behind nodes) ── -->
  <!-- bullish-bullish -->
  <line x1="280" y1="110" x2="370" y2="148" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="370" y1="148" x2="430" y2="108" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.18"/>
  <!-- bearish-bearish -->
  <line x1="510" y1="130" x2="570" y2="175" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="570" y1="175" x2="545" y2="235" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.18"/>
  <!-- cross-sentiment debate lines (thicker, more visible) -->
  <line x1="370" y1="148" x2="510" y2="130" stroke="rgba(255,255,255,0.07)" stroke-width="1.2"/>
  <line x1="280" y1="110" x2="510" y2="130" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="430" y1="108" x2="570" y2="175" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="370" y1="148" x2="400" y2="210" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
  <line x1="510" y1="130" x2="400" y2="210" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
  <line x1="280" y1="110" x2="400" y2="210" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="430" y1="108" x2="400" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="545" y1="235" x2="400" y2="210" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="230" y1="195" x2="400" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="230" y1="195" x2="280" y2="110" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>
  <line x1="230" y1="195" x2="370" y2="148" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>
  <line x1="470" y1="258" x2="400" y2="210" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="470" y1="258" x2="545" y2="235" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>
  <line x1="330" y1="265" x2="400" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="330" y1="265" x2="230" y2="195" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>
  <line x1="610" y1="248" x2="545" y2="235" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>
  <line x1="610" y1="248" x2="400" y2="210" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>

  <!-- ── Agent nodes ── -->

  <!-- Glows behind nodes -->
  <circle cx="280" cy="110" r="18" fill="#22c55e" fill-opacity="0.15"/>
  <circle cx="370" cy="148" r="18" fill="#22c55e" fill-opacity="0.15"/>
  <circle cx="430" cy="108" r="14" fill="#22c55e" fill-opacity="0.12"/>
  <circle cx="510" cy="130" r="18" fill="#ef4444" fill-opacity="0.15"/>
  <circle cx="570" cy="175" r="14" fill="#ef4444" fill-opacity="0.12"/>
  <circle cx="545" cy="235" r="16" fill="#ef4444" fill-opacity="0.13"/>
  <circle cx="230" cy="195" r="14" fill="#facc15" fill-opacity="0.12"/>
  <circle cx="400" cy="210" r="22" fill="#22c55e" fill-opacity="0.12"/>
  <circle cx="470" cy="258" r="14" fill="#facc15" fill-opacity="0.10"/>
  <circle cx="330" cy="265" r="13" fill="#ef4444" fill-opacity="0.10"/>
  <circle cx="610" cy="248" r="12" fill="#22c55e" fill-opacity="0.10"/>

  <!-- Node dots -->
  <!-- Bullish nodes — green -->
  <circle cx="280" cy="110" r="7" fill="#22c55e" fill-opacity="0.9"/>
  <circle cx="370" cy="148" r="8" fill="#22c55e" fill-opacity="0.95"/>
  <circle cx="430" cy="108" r="5.5" fill="#22c55e" fill-opacity="0.75"/>
  <circle cx="400" cy="210" r="9" fill="#22c55e" fill-opacity="0.95"/>
  <circle cx="610" cy="248" r="5" fill="#22c55e" fill-opacity="0.7"/>

  <!-- Bearish nodes — red -->
  <circle cx="510" cy="130" r="7.5" fill="#ef4444" fill-opacity="0.9"/>
  <circle cx="570" cy="175" r="5.5" fill="#ef4444" fill-opacity="0.75"/>
  <circle cx="545" cy="235" r="6.5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="330" cy="265" r="5" fill="#ef4444" fill-opacity="0.7"/>

  <!-- Neutral nodes — amber -->
  <circle cx="230" cy="195" r="5.5" fill="#facc15" fill-opacity="0.75"/>
  <circle cx="470" cy="258" r="5.5" fill="#facc15" fill-opacity="0.72"/>

  <!-- ── Signal arrows on center node (aggregate direction) ── -->
  <!-- Up-arrow above center node -->
  <path d="M400 188 L393 198 L397 198 L397 208 L403 208 L403 198 L407 198 Z" fill="#22c55e" fill-opacity="0.85"/>

  <!-- ── Sentiment bar (bottom of graphic area) ── -->
  <rect x="200" y="295" width="400" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <!-- bullish fill ~60% -->
  <rect x="200" y="295" width="240" height="6" rx="3" fill="#22c55e" fill-opacity="0.7"/>
  <!-- neutral fill ~15% -->
  <rect x="440" y="295" width="60" height="6" fill="#facc15" fill-opacity="0.6"/>
  <!-- bearish fill ~25% -->
  <rect x="500" y="295" width="100" height="6" rx="3" fill="#ef4444" fill-opacity="0.6"/>

  <!-- Bar labels -->
  <text x="200" y="314" font-family="system-ui, -apple-system, monospace" font-size="10" fill="#22c55e" fill-opacity="0.7" letter-spacing="1">▲ 60%</text>
  <text x="400" y="314" font-family="system-ui, -apple-system, monospace" font-size="10" fill="#facc15" fill-opacity="0.65" text-anchor="middle" letter-spacing="1">◆ 15%</text>
  <text x="600" y="314" font-family="system-ui, -apple-system, monospace" font-size="10" fill="#ef4444" fill-opacity="0.7" text-anchor="end" letter-spacing="1">▼ 25%</text>

  <!-- ── Wordmark ── -->
  <text x="400" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" letter-spacing="6" fill="#f0f0f0" text-anchor="middle">swarm</text>

  <!-- Tagline -->
  <text x="400" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#444" text-anchor="middle" letter-spacing="4">MULTI-AGENT MARKET SENTIMENT</text>

</svg>
