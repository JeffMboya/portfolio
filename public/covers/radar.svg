<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">

  <!-- Background: deep violet-black — clearly distinct from swarm's neutral #060D14 -->
  <rect width="800" height="400" fill="#07050F"/>

  <!-- Subtle CRT scan line texture -->
  <pattern id="scanlines" width="800" height="4" patternUnits="userSpaceOnUse">
    <rect y="2" width="800" height="1" fill="rgba(0,0,0,0.10)"/>
  </pattern>
  <rect width="800" height="400" fill="url(#scanlines)"/>

  <!-- Faint horizontal grid lines (terminal aesthetic) -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>

  <!-- ── LEFT ZONE: raw arXiv feed (unranked papers) ── -->

  <!-- Zone label -->
  <text x="55" y="58" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.18)" letter-spacing="2">arXiv feed</text>
  <line x1="55" y1="62" x2="195" y2="62" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

  <!-- Paper rectangles — loose scatter, dim, representing unfiltered raw feed -->
  <!-- Row 1 -->
  <rect x="58"  y="74"  width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.18)" stroke-width="0.5"/>
  <rect x="84"  y="70"  width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.09)" stroke="rgba(167,139,250,0.14)" stroke-width="0.5"/>
  <rect x="110" y="76"  width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.11)" stroke="rgba(167,139,250,0.16)" stroke-width="0.5"/>
  <rect x="136" y="72"  width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.12)" stroke-width="0.5"/>
  <rect x="162" y="77"  width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.10)" stroke="rgba(167,139,250,0.15)" stroke-width="0.5"/>
  <!-- Row 2 -->
  <rect x="62"  y="106" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.09)" stroke="rgba(167,139,250,0.13)" stroke-width="0.5"/>
  <rect x="88"  y="101" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.18)" stroke-width="0.5"/>
  <rect x="114" y="108" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.11)" stroke-width="0.5"/>
  <rect x="140" y="103" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.10)" stroke="rgba(167,139,250,0.14)" stroke-width="0.5"/>
  <rect x="166" y="107" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.10)" stroke-width="0.5"/>
  <!-- Row 3 -->
  <rect x="58"  y="138" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.10)" stroke="rgba(167,139,250,0.15)" stroke-width="0.5"/>
  <rect x="84"  y="134" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.11)" stroke-width="0.5"/>
  <rect x="110" y="140" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.11)" stroke="rgba(167,139,250,0.16)" stroke-width="0.5"/>
  <rect x="136" y="136" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.09)" stroke="rgba(167,139,250,0.13)" stroke-width="0.5"/>
  <rect x="162" y="141" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.10)" stroke-width="0.5"/>
  <!-- Row 4 -->
  <rect x="62"  y="170" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.11)" stroke-width="0.5"/>
  <rect x="88"  y="167" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.10)" stroke="rgba(167,139,250,0.14)" stroke-width="0.5"/>
  <rect x="114" y="173" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.09)" stroke="rgba(167,139,250,0.13)" stroke-width="0.5"/>
  <rect x="140" y="168" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.10)" stroke-width="0.5"/>
  <!-- Row 5 -->
  <rect x="58"  y="202" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.09)" stroke="rgba(167,139,250,0.12)" stroke-width="0.5"/>
  <rect x="84"  y="198" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.10)" stroke-width="0.5"/>
  <rect x="110" y="205" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.11)" stroke-width="0.5"/>
  <rect x="136" y="200" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.09)" stroke-width="0.5"/>
  <!-- Row 6 (sparse) -->
  <rect x="62"  y="234" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.09)" stroke-width="0.5"/>
  <rect x="90"  y="231" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.08)" stroke-width="0.5"/>
  <rect x="118" y="236" width="19" height="14" rx="1.5" fill="rgba(167,139,250,0.05)" stroke="rgba(167,139,250,0.08)" stroke-width="0.5"/>

  <!-- ── CENTER: analyze / scan beam ── -->

  <!-- Funnel lines narrowing from left zone to beam -->
  <line x1="200" y1="68"  x2="252" y2="140" stroke="rgba(167,139,250,0.12)" stroke-width="0.8"/>
  <line x1="200" y1="248" x2="252" y2="185" stroke="rgba(167,139,250,0.12)" stroke-width="0.8"/>

  <!-- Scan beam: vertical glowing line -->
  <radialGradient id="beamGlow" cx="255" cy="162" r="80" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <rect x="225" y="100" width="60" height="125" rx="4" fill="url(#beamGlow)"/>
  <line x1="255" y1="96" x2="255" y2="232" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Beam pulse marks -->
  <line x1="248" y1="130" x2="262" y2="130" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="248" y1="162" x2="262" y2="162" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="248" y1="194" x2="262" y2="194" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.35"/>
  <!-- Label -->
  <text x="255" y="248" font-family="monospace" font-size="8" fill="rgba(167,139,250,0.38)" text-anchor="middle" letter-spacing="1.5">analyze</text>

  <!-- Arrow from beam to bars -->
  <line x1="275" y1="162" x2="310" y2="162" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
  <polygon points="310,162 302,158 302,166" fill="rgba(167,139,250,0.30)"/>

  <!-- ── RIGHT ZONE: ranked signal bars ── -->

  <!-- Zone label -->
  <text x="325" y="58" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.18)" letter-spacing="2">ranked by signal</text>
  <line x1="325" y1="62" x2="660" y2="62" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

  <!-- Baseline -->
  <line x1="325" y1="292" x2="665" y2="292" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- Bar gradients -->
  <linearGradient id="barHigh1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.80"/>
    <stop offset="100%" stop-color="#22c55e" stop-opacity="0.25"/>
  </linearGradient>
  <linearGradient id="barHigh2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#22c55e" stop-opacity="0.18"/>
  </linearGradient>
  <linearGradient id="barHigh3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#22c55e" stop-opacity="0.14"/>
  </linearGradient>
  <linearGradient id="barMed1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.18"/>
  </linearGradient>
  <linearGradient id="barMed2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.50"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="barLow1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6b7280" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#6b7280" stop-opacity="0.10"/>
  </linearGradient>
  <linearGradient id="barLow2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6b7280" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#6b7280" stop-opacity="0.08"/>
  </linearGradient>

  <!-- Bar 1: signal 9 — tallest, best build highlight -->
  <radialGradient id="bestBuildGlow" cx="355" cy="108" r="55" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
  </radialGradient>
  <rect x="330" y="70" width="50" height="222" rx="2" fill="url(#bestBuildGlow)"/>
  <rect x="338" y="108" width="34" height="184" rx="2" fill="url(#barHigh1)"/>
  <rect x="338" y="108" width="34" height="184" rx="2" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.40"/>
  <text x="355" y="100" font-family="monospace" font-size="9" fill="#22c55e" fill-opacity="0.75" text-anchor="middle">9</text>
  <!-- Best build badge -->
  <rect x="326" y="74" width="58" height="16" rx="2" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="0.6" stroke-opacity="0.40"/>
  <text x="355" y="85" font-family="monospace" font-size="8" fill="#22c55e" fill-opacity="0.75" text-anchor="middle" letter-spacing="0.5">BEST BUILD</text>

  <!-- Bar 2: signal 8 -->
  <rect x="394" y="133" width="34" height="159" rx="2" fill="url(#barHigh2)"/>
  <text x="411" y="125" font-family="monospace" font-size="9" fill="#22c55e" fill-opacity="0.62" text-anchor="middle">8</text>

  <!-- Bar 3: signal 8 -->
  <rect x="440" y="143" width="34" height="149" rx="2" fill="url(#barHigh3)"/>
  <text x="457" y="135" font-family="monospace" font-size="9" fill="#22c55e" fill-opacity="0.55" text-anchor="middle">8</text>

  <!-- Bar 4: signal 7 -->
  <rect x="486" y="172" width="34" height="120" rx="2" fill="url(#barHigh3)"/>
  <text x="503" y="164" font-family="monospace" font-size="9" fill="#22c55e" fill-opacity="0.48" text-anchor="middle">7</text>

  <!-- Bar 5: signal 6 -->
  <rect x="532" y="200" width="34" height="92" rx="2" fill="url(#barMed1)"/>
  <text x="549" y="192" font-family="monospace" font-size="9" fill="#f59e0b" fill-opacity="0.60" text-anchor="middle">6</text>

  <!-- Bar 6: signal 5 -->
  <rect x="578" y="222" width="34" height="70" rx="2" fill="url(#barMed2)"/>
  <text x="595" y="214" font-family="monospace" font-size="9" fill="#f59e0b" fill-opacity="0.48" text-anchor="middle">5</text>

  <!-- Bar 7: signal 4 -->
  <rect x="624" y="245" width="34" height="47" rx="2" fill="url(#barLow1)"/>
  <text x="641" y="237" font-family="monospace" font-size="9" fill="#6b7280" fill-opacity="0.50" text-anchor="middle">4</text>

  <!-- DAG dependency edges between top bars (at bar tops) -->
  <!-- P1 → P3 (enables) -->
  <path d="M372 120 Q413 105 440 143" stroke="rgba(34,197,94,0.20)" stroke-width="1" fill="none"/>
  <!-- P2 → P1 (requires) -->
  <path d="M394 133 Q377 120 372 120" stroke="rgba(34,197,94,0.15)" stroke-width="0.8" fill="none"/>
  <!-- arrowhead P1→P3 -->
  <polygon points="440,143 433,136 437,146" fill="rgba(34,197,94,0.22)"/>
  <!-- P3 → P4 (predicts) -->
  <path d="M474 152 Q480 155 486 172" stroke="rgba(34,197,94,0.14)" stroke-width="0.8" fill="none"/>
  <polygon points="486,172 481,162 489,163" fill="rgba(34,197,94,0.18)"/>

  <!-- Paper index labels below baseline -->
  <text x="355" y="306" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.22)" text-anchor="middle">[1]</text>
  <text x="411" y="306" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.18)" text-anchor="middle">[2]</text>
  <text x="457" y="306" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.16)" text-anchor="middle">[3]</text>
  <text x="503" y="306" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.14)" text-anchor="middle">[4]</text>
  <text x="549" y="306" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.12)" text-anchor="middle">[5]</text>
  <text x="595" y="306" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.10)" text-anchor="middle">[6]</text>
  <text x="641" y="306" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.08)" text-anchor="middle">[7]</text>

  <!-- ── Wordmark ── -->
  <text x="400" y="356" font-family="system-ui, -apple-system, sans-serif"
        font-size="40" font-weight="600" letter-spacing="6"
        fill="#f0f0f0" text-anchor="middle">radar</text>

  <!-- Tagline -->
  <text x="400" y="383" font-family="system-ui, -apple-system, sans-serif"
        font-size="12" fill="#444" text-anchor="middle" letter-spacing="4">AI RESEARCH DIGEST</text>

</svg>
