<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">

  <!-- Terminal black — nothing like swarm's node-graph aesthetic -->
  <rect width="800" height="400" fill="#0F0F12"/>

  <!-- ── Header ── -->
  <text x="40" y="42" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="14" font-weight="700" fill="#e2e8f0" letter-spacing="0.3">radar</text>
  <text x="90" y="42" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="14" fill="rgba(255,255,255,0.35)"> — AI Research Digest</text>

  <line x1="40" y1="52" x2="760" y2="52" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>

  <!-- ── Paper [1] ── -->

  <!-- Index + title -->
  <text x="40" y="78" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="13" font-weight="700" fill="#22d3ee">[1]</text>
  <text x="72" y="78" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="13" font-weight="700" fill="#f1f5f9">Speculative Decoding with Adaptive Draft Length</text>

  <!-- Authors · ID · Date -->
  <text x="72" y="95" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5" fill="rgba(255,255,255,0.36)">Park, Kim et al.  ·  2603.18241  ·  27 Mar 2026</text>

  <!-- Claim -->
  <text x="72" y="118" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="12" fill="rgba(255,255,255,0.45)">↳</text>
  <text x="88" y="118" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="12" fill="rgba(255,255,255,0.78)">Tuning draft length per input token distribution raises</text>
  <text x="88" y="133" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="12" fill="rgba(255,255,255,0.78)">throughput 2.4× with no output quality regression.</text>

  <!-- DEPS label -->
  <text x="72" y="157" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5" font-weight="700" fill="rgba(255,255,255,0.90)" letter-spacing="1">DEPS</text>

  <!-- edge 1 -->
  <text x="72" y="173" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5">
    <tspan fill="#22d3ee">draft_length</tspan>
    <tspan fill="rgba(255,255,255,0.45)"> → </tspan>
    <tspan fill="#22d3ee">acceptance_rate</tspan>
    <tspan fill="rgba(255,255,255,0.28)">  (drives)</tspan>
  </text>

  <!-- edge 2 -->
  <text x="72" y="189" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5">
    <tspan fill="#22d3ee">acceptance_rate</tspan>
    <tspan fill="rgba(255,255,255,0.45)"> → </tspan>
    <tspan fill="#22d3ee">throughput</tspan>
    <tspan fill="rgba(255,255,255,0.28)">       (predicts)</tspan>
  </text>

  <!-- edge 3 -->
  <text x="72" y="205" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5">
    <tspan fill="#22d3ee">throughput</tspan>
    <tspan fill="rgba(255,255,255,0.45)"> → </tspan>
    <tspan fill="#22d3ee">inference_cost</tspan>
    <tspan fill="rgba(255,255,255,0.28)">    (reduces)</tspan>
  </text>

  <!-- BUILD -->
  <text x="72" y="228" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5" font-weight="700" fill="rgba(255,255,255,0.90)" letter-spacing="1">BUILD</text>
  <text x="122" y="228" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5">
    <tspan fill="#22c55e">████████░░</tspan>
    <tspan fill="rgba(255,255,255,0.55)">  8/10  ·  speculative-bench — tunes draft length</tspan>
  </text>
  <text x="122" y="244" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5" fill="rgba(255,255,255,0.55)">for your model pair, reports throughput at each config</text>

  <!-- Tags -->
  <text x="72" y="260" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5" fill="rgba(255,255,255,0.28)">#inference  #speculative-decoding  #throughput</text>

  <!-- Separator -->
  <line x1="40" y1="278" x2="760" y2="278" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- ── Synthesis footer ── -->

  <!-- TRENDING -->
  <text x="40" y="298" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5">
    <tspan fill="rgba(255,255,255,0.55)" font-weight="700" letter-spacing="1">TRENDING</tspan>
    <tspan fill="#22d3ee" dx="10">#speculative_decoding</tspan>
    <tspan fill="#22d3ee" dx="8">#adaptive_routing</tspan>
    <tspan fill="#22d3ee" dx="8">#cost_reduction</tspan>
  </text>

  <!-- BEST BUILD -->
  <text x="40" y="317" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11.5">
    <tspan fill="rgba(255,255,255,0.55)" font-weight="700" letter-spacing="1">BEST BUILD</tspan>
    <tspan fill="rgba(255,255,255,0.45)" dx="10">[1]</tspan>
    <tspan fill="#22c55e" dx="6">speculative-bench</tspan>
    <tspan fill="rgba(255,255,255,0.28)" dx="6">·  novel mechanism, ships in a weekend</tspan>
  </text>

  <!-- radar build hint -->
  <text x="40" y="350" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11" fill="rgba(255,255,255,0.18)">$ radar build 1</text>
  <text x="150" y="350" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="11" fill="rgba(255,255,255,0.12)">→  full project brief, task list, effort estimate</text>

  <!-- Cursor blink indicator (just a static block) -->
  <rect x="40" y="356" width="8" height="13" rx="0" fill="rgba(255,255,255,0.20)"/>

</svg>
