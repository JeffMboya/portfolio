<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">

  <rect width="800" height="220" fill="#0F0F12"/>

  <!-- Divider line down the center -->
  <line x1="400" y1="20" x2="400" y2="200" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Left column header: Individual dev -->
  <text x="60" y="44" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1">INDIVIDUAL DEVELOPER</text>
  <line x1="60" y1="52" x2="360" y2="52" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>

  <!-- Left steps -->
  <text x="60" y="76" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">uses Claude to write a function</text>
  <text x="60" y="97" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">reads it, tests it, makes the call</text>
  <text x="60" y="118" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">commits under their own name</text>
  <text x="60" y="139" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">can be asked to explain decisions</text>

  <!-- Left verdict -->
  <text x="60" y="172" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="11.5" fill="rgba(34,197,94,0.80)">human in the loop</text>
  <text x="60" y="188" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="11" fill="rgba(255,255,255,0.25)">norms: undefined</text>

  <!-- Right column header: Undercover Mode -->
  <text x="440" y="44" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="11" font-weight="700" fill="rgba(245,158,11,0.80)" letter-spacing="1">UNDERCOVER MODE</text>
  <line x1="440" y1="52" x2="740" y2="52" stroke="rgba(245,158,11,0.12)" stroke-width="0.6"/>

  <!-- Right steps -->
  <text x="440" y="76" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">agent writes code autonomously</text>
  <text x="440" y="97" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">no human reviews the output</text>
  <text x="440" y="118" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">origin concealed by design</text>
  <text x="440" y="139" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="12" fill="rgba(255,255,255,0.65)">no one to question</text>

  <!-- Right verdict -->
  <text x="440" y="172" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="11.5" fill="rgba(245,158,11,0.80)">no human in the loop</text>
  <text x="440" y="188" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="11" fill="rgba(255,255,255,0.25)">norms: undefined</text>

  <!-- Center label -->
  <rect x="310" y="96" width="180" height="28" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
  <text x="400" y="114" font-family="ui-monospace,'Cascadia Code','Fira Mono',monospace" font-size="10.5" fill="rgba(255,255,255,0.40)" text-anchor="middle">same open question</text>

</svg>
